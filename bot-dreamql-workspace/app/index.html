<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>DreamQL</title>
<style>
:root{
  --top:#350d36; --rail:#3f0e40; --side:#2b0b2c; --side-hover:#3a1a3b; --side-active:#5e2a60;
  --side-text:#c7b6c8; --side-read:#a593a6; --white:#fff;
  --bg:#1a1d21; --bg2:#222529; --hover:#222529; --border:#35373b; --text:#d1d2d3; --muted:#9a9b9e;
  --link:#1d9bd1; --new:#e01e5a; --badge:#c4a2e8; --green:#2bac76;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--top);color:var(--text);font:15px/1.46 Lato,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
#shell{display:grid;grid-template-rows:40px 1fr;height:100vh}
/* top bar */
.topbar{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--top)}
.topbar .nav{display:flex;gap:6px;color:#cdb9ce;font-size:16px;width:240px;justify-content:flex-end;padding-right:8px}
.search{flex:1;max-width:720px;margin:0 auto;height:26px;border-radius:6px;background:#5d3a5e;border:1px solid #6d4c6e;color:#fff;padding:0 10px;font-size:13px;outline:none}
.search::placeholder{color:#d9c9da}
.topbar .help{width:240px;text-align:right;color:#cdb9ce}
#cols{display:grid;grid-template-columns:70px 300px 1fr;min-height:0}
/* rail */
.rail{background:var(--top);display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:14px}
.logo{width:36px;height:36px;border-radius:8px;background:#fff;color:#c8102e;font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;line-height:1;text-align:center}
.rbtn{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#e8dde9;gap:3px;position:relative}
.rbtn .ico{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.rbtn.on .ico,.rbtn:hover .ico{background:rgba(255,255,255,.18)}
.rbtn .rb{position:absolute;top:-4px;right:2px;background:var(--new);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px;text-align:center}
svg.i{vertical-align:-3px;flex:0 0 auto}.tab svg.i{vertical-align:-2px}.rail .me{margin-top:auto;margin-bottom:14px}
/* sidebar */
.side{background:var(--side);border-radius:8px 0 0 0;display:flex;flex-direction:column;min-height:0;border-right:1px solid #3d2a3e}
.ws{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;color:#fff;font-weight:900;font-size:18px}
.ws .tools{display:flex;gap:10px;color:#cdb9ce;font-size:16px;font-weight:400}
.find{margin:4px 12px 8px;height:28px;border-radius:6px;border:1px solid #5a465b;background:transparent;color:#fff;padding:0 10px;font-size:13px;outline:none}
.find::placeholder{color:#a793a8}
.list{overflow-y:auto;flex:1;padding-bottom:16px}
.sec-h{display:flex;align-items:center;gap:6px;padding:6px 16px;color:var(--side-text);font-size:15px;cursor:pointer;user-select:none;margin-top:6px}
.sec-h .chev{font-size:10px;transition:transform .15s;width:12px}
.sec.col .chev{transform:rotate(-90deg)} .sec.col .items{display:none}
.it{display:flex;align-items:center;gap:8px;margin:0 8px;padding:3px 10px;border-radius:6px;color:var(--side-read);cursor:pointer;white-space:nowrap}
.it:hover{background:var(--side-hover)}
.it.on{background:var(--side-active);color:#fff}
.it .ic{width:18px;text-align:center;opacity:.85;flex:0 0 18px;font-size:14px}
.it .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.it.unread .nm{color:#fff;font-weight:900}
.it .cnt{background:var(--badge);color:#2b0b2c;font-size:12px;font-weight:800;border-radius:9px;padding:0 7px}
.it .face{width:20px;height:20px;border-radius:5px;font-size:9px;flex:0 0 20px}
.it .sub{font-size:12px;color:#8a778b;margin-left:4px}
.empty-s{padding:2px 26px;font-size:13px;color:#8a778b}
/* main */
.main{background:var(--bg);display:grid;grid-template-columns:1fr auto;min-height:0;min-width:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.chead{padding:10px 20px 0;border-bottom:1px solid var(--border)}
.chead .row{display:flex;align-items:center;gap:10px}
.chead .t{font-weight:900;font-size:18px;color:#fff;display:flex;align-items:center;gap:6px;min-width:0}
.chead .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .right{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.stack{display:flex}.stack .face{width:24px;height:24px;border-radius:6px;font-size:10px;margin-left:-6px;border:2px solid var(--bg)}
.tabs{display:flex;gap:18px;margin-top:8px;font-size:13px}
.tab{padding:6px 2px 8px;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:#fff;font-weight:700;border-bottom-color:#fff}
.desc{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed{flex:1;overflow-y:auto;padding:8px 0 16px}
.day{display:flex;align-items:center;margin:10px 0 2px;padding:4px 0;position:sticky;top:0;z-index:2;background:var(--bg)}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--border)}
.day span{border:1px solid var(--border);border-radius:14px;padding:2px 14px;font-size:13px;font-weight:700;color:#fff;background:var(--bg)}
.newline{display:flex;align-items:center;color:var(--new);font-size:12px;font-weight:700;margin:6px 0}
.newline::before{content:"";flex:1;height:1px;background:var(--new);margin-right:8px}
.newline span{padding-right:16px}
.msg{display:flex;gap:10px;padding:8px 20px}
.msg:hover{background:var(--hover)}
.msg.hit{background:#3a3418}
.face{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;border-radius:8px;flex:0 0 auto}
.msg>.face{width:36px;height:36px;font-size:14px}
.mc{min-width:0;flex:1}
.mh{display:flex;align-items:baseline;gap:8px}
.mh .au{font-weight:900;color:#fff}
.mh .tm{font-size:12px;color:var(--muted)}
.unread-msg .mh .au::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--new);margin-left:6px;vertical-align:middle}
.tx{white-space:pre-wrap;word-wrap:break-word;color:var(--text)}
.tx strong{color:#fff}
.tx code{background:#2c2d30;border:1px solid #3c3d40;border-radius:3px;padding:0 4px;font-size:13px;color:#e8912d}
.tx pre{background:#232529;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;overflow-x:auto;white-space:pre}
.tx .mn{background:rgba(29,155,209,.15);color:#1d9bd1;border-radius:3px;padding:0 2px}
.tx .h{font-weight:900;color:#fff}
.reply{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:3px 8px 3px 4px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-size:13px}
.reply:hover{border-color:var(--border);background:var(--bg)}
.reply .stack .face{width:22px;height:22px;font-size:9px;border-color:var(--bg2)}
.reply .rc{color:var(--link);font-weight:700}
.reply.ur .rc{color:#fff;font-weight:900}
.reply .lr{color:var(--muted)}
.reply .vt{color:var(--muted);display:none}.reply:hover .vt{display:inline}
/* artifacts */
.arts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.card{border:1px solid var(--border);border-left:4px solid #5e5f62;border-radius:8px;background:var(--bg2);max-width:560px;overflow:hidden}
.card .ch{display:flex;align-items:center;gap:10px;padding:10px 12px}
.card .fi{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex:0 0 36px}
.card .ct{font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cs{font-size:12px;color:var(--muted)}
.card .cb{margin-left:auto;display:flex;gap:6px}
.card .cb button,.card .cb a{border:1px solid var(--border);border-radius:6px;padding:2px 10px;font-size:12px;color:var(--text);background:var(--bg)}
.card img{display:block;max-width:100%;max-height:340px;cursor:zoom-in;background:#111}
.card .prev{border-top:1px solid var(--border);padding:8px 12px;font-size:13px;max-height:180px;overflow:hidden;color:var(--text);white-space:pre-wrap;position:relative}
.card .prev::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--bg2))}
.card table{border-collapse:collapse;font-size:12px;width:100%}
.card td,.card th{border-bottom:1px solid var(--border);padding:3px 6px;text-align:left;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.card th{color:#fff}
.card.k-html{border-left-color:#e8912d}.card.k-app{border-left-color:#2bac76}.card.k-table{border-left-color:#1d9bd1}.card.k-text{border-left-color:#ecb22e}.card.k-file{border-left-color:#cd2553}
/* composer */
.composer{margin:0 20px 16px;border:1px solid #565856;border-radius:8px;background:var(--bg2)}
.composer .in{padding:10px 12px;color:var(--muted)}
.composer .tb{display:flex;align-items:center;gap:14px;padding:4px 10px 8px;color:var(--muted);font-size:15px}
.composer .tb .snd{margin-left:auto;opacity:.5}
.ro{font-size:11px;color:#7b7c7f;margin:-10px 22px 10px}.composer textarea.in{display:block;width:100%;background:transparent;border:0;outline:none;resize:none;color:var(--text);font:inherit;max-height:200px;line-height:1.4}.composer textarea.in::placeholder{color:var(--muted)}.composer textarea.in:disabled{opacity:.5}.composer .snd{background:none;color:var(--muted);border-radius:4px;padding:3px 7px;opacity:1}.composer .snd.go{background:#007a5a;color:#fff}.composer:focus-within{border-color:#8d8d8e}.tp .composer{margin:0 16px 14px}.tp .ro{margin:-8px 18px 10px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e01e5a;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:60;display:none}.toast.ok{background:#2bac76}.working{display:flex;align-items:center;gap:8px;padding:6px 20px;color:var(--muted);font-size:13px;font-style:italic}
/* thread panel */
.tp{width:460px;border-left:1px solid var(--border);display:none;flex-direction:column;min-height:0;background:var(--bg)}
.tp.open{display:flex}
.tph{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.tph .t{font-weight:900;color:#fff;font-size:18px}
.tph .s{color:var(--muted);font-size:13px;margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.tph .x{margin-left:auto;font-size:22px;color:var(--muted)}
.tph a{font-size:12px;margin-left:10px;white-space:nowrap}
.rdiv{display:flex;align-items:center;gap:8px;margin:6px 20px;color:var(--muted);font-size:13px}
.rdiv::after{content:"";flex:1;height:1px;background:var(--border)}
.tp .msg>.face{width:32px;height:32px;font-size:12px}
/* files tab */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:16px 20px}
.fgrid .card{max-width:none}
.fgrid .from{font-size:11px;color:var(--muted);padding:0 12px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.blank{color:var(--muted);text-align:center;margin-top:60px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #444;border-top-color:#aaa;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50}
.modal.open{display:flex}
.modal .box{width:min(1200px,92vw);height:88vh;background:#fff;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.modal .bh{display:flex;align-items:center;padding:8px 12px;background:var(--bg2);color:#fff;font-weight:700}
.modal .bh button{margin-left:auto;font-size:22px}
.modal iframe{flex:1;border:0;width:100%;background:#fff}
.modal .imgbox{flex:1;display:flex;align-items:center;justify-content:center;background:#111;overflow:auto}
.modal .imgbox img{max-width:100%;max-height:100%}
</style>
<style id="dq-core-v2">
.composer .tb .tl{background:none;border:0;color:inherit;cursor:pointer;padding:2px 5px;border-radius:4px;font:inherit;line-height:1}
.composer .tb .tl:hover,.composer .tb .tl.on{background:#ffffff1a;color:#fff}
</style>
</head>
<body>
<div id="shell">
  <div class="topbar">
    <div class="nav"><span>←</span><span>→</span><span data-ic="clock"></span></div>
    <input class="search" id="search" placeholder="Search in this conversation" oninput="searchFeed(this.value)"/>
    <div class="help">?</div>
  </div>
  <div id="cols">
    <div class="rail">
      <div class="logo">DREAM<br/>SPORTS</div>
      <button class="rbtn on" id="r-home" onclick="setFilter('all')"><span class="ico">⌂</span>Home</button>
      <button class="rbtn" id="r-dms" onclick="setFilter('dms')"><span class="ico" data-ic="dms" data-w="20"></span>DMs</button>
      <button class="rbtn" id="r-act" onclick="setFilter('unread')"><span class="ico" data-ic="bell" data-w="20"></span>Activity<span class="rb" id="rb-act" style="display:none"></span></button>
      <button class="rbtn" id="r-files" onclick="showTab('files')"><span class="ico" data-ic="files" data-w="20"></span>Files</button>
      <button class="rbtn" onclick="refreshAll()"><span class="ico" data-ic="refresh" data-w="20"></span>Refresh</button>
      <div class="me" id="meFace"></div>
    </div>
    <div class="side">
      <div class="ws"><span>Dream Sports ▾</span><span class="tools"><span data-ic="gear"></span><span data-ic="compose"></span></span></div>
      <input class="find" id="find" placeholder="Find a conversation…" oninput="renderSide()"/>
      <div class="list" id="list"><div class="blank"><span class="spin"></span></div></div>
    </div>
    <div class="main">
      <div class="pane" id="pane"><div class="blank">Pick a channel or DM on the left.</div></div>
      <div class="tp" id="tp"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box" id="mbox"></div></div>
<script>

const SV={clock:'<circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/>',
dms:'<path d="M4 4h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H9l-4 3v-3H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/>',
bell:'<path d="M10 3a5 5 0 0 0-5 5v3l-1.5 2.5h13L15 11V8a5 5 0 0 0-5-5zM8 16a2 2 0 0 0 4 0"/>',
files:'<path d="M3 5h5l2 2h7v9H3z"/>',
refresh:'<path d="M16 10a6 6 0 1 1-1.8-4.3M16 3v3.5h-3.5"/>',
gear:'<circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.3M10 15.2v2.3M2.5 10h2.3M15.2 10h2.3M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/>',
compose:'<path d="M4 16h3l9-9-3-3-9 9z"/><path d="M11.5 5.5l3 3"/>',
lock:'<rect x="4.5" y="9" width="11" height="8" rx="1.5"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9"/>',
pin:'<path d="M8 3h4l-.8 5 3 3H5.8l3-3zM10 11v6"/>',
plus:'<path d="M10 4v12M4 10h12"/>',
smile:'<circle cx="10" cy="10" r="7"/><path d="M7 12a3.6 3.6 0 0 0 6 0M7.5 8h.01M12.5 8h.01"/>',
video:'<rect x="2.5" y="6" width="10" height="8" rx="1.5"/><path d="M12.5 9l5-2.5v7l-5-2.5"/>',
mic:'<rect x="8" y="3" width="4" height="9" rx="2"/><path d="M5.5 10a4.5 4.5 0 0 0 9 0M10 14.5V17"/>',
send:'<path d="M3 17l14-7L3 3l2 7zM5 10h6"/>'};
function ic(n,w){w=w||16;return `<svg class="i" viewBox="0 0 20 20" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${SV[n]||""}</svg>`}
function paintIcons(root){(root||document).querySelectorAll("[data-ic]").forEach(e=>{e.innerHTML=ic(e.dataset.ic,+e.dataset.w||16)})}

const COLORS=["#e8912d","#2bac76","#1264a3","#cd2553","#7c3085","#1d9bd1","#d4a017","#b0532c","#3a7d44","#5b5bd6"];
const BOT="DreamBot";
const S={boot:null,filter:"all",room:null,roomData:null,tab:"messages",thread:null,newFrom:null};
/* ---------- DQ plug-in bus (core v2) — modules attach here, never edit this file ---------- */
const DQ=window.DQ={version:2,hooks:{},tools:{},
  on(ev,fn){(this.hooks[ev]=this.hooks[ev]||[]).push(fn)},
  emit(ev,p){(this.hooks[ev]||[]).forEach(f=>{try{f(p)}catch(e){console.warn("DQ hook",ev,e)}});return p},
  async pipe(ev,p){for(const f of (this.hooks[ev]||[])){try{const r=await f(p);if(r)p=r}catch(e){console.warn("DQ pipe",ev,e)}}return p},
  tool(name,fn){this.tools[name]=fn}};
function toolbarHtml(){const b=(t,title,inner)=>`<button type="button" class="tl" data-tool="${t}" title="${title}" aria-label="${title}">${inner}</button>`;
  return b("plus","Attach",ic("plus"))+b("format","Formatting","Aa")+b("emoji","Emoji",ic("smile"))+b("mention","Mention someone","@")+b("mic","Dictate",ic("mic"))+b("slash","Shortcuts","/")}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-tool]");if(!b)return;e.preventDefault();
  const c=b.closest(".composer"),input=c&&c.querySelector("textarea"),kind=input&&input.id==="tin"?"thread":"room";
  const fn=DQ.tools[b.dataset.tool];if(fn){try{fn({button:b,composer:c,input,kind})}catch(x){console.warn("DQ tool",x)}}else toast("Coming soon")});

const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function color(s){let h=0;for(const c of String(s||""))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
function ini(n){if(n===BOT)return "DB";const p=String(n||"?").replace(/\(.*?\)/g,"").trim().split(/\s+/);return ((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase()}
function face(n,cls="face",style=""){return `<span class="${cls}" style="background:${n===BOT?"#4a154b":color(n)};${style}" title="${esc(n)}">${esc(ini(n))}</span>`}
function d(iso){return iso?new Date(iso):null}
function tm(iso){const x=d(iso);return x?x.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):""}
function dayKey(iso){const x=d(iso);return x?x.toDateString():""}
function dayLabel(iso){const x=d(iso);if(!x)return "";const t=new Date();const y=new Date(Date.now()-864e5);
  if(x.toDateString()===t.toDateString())return "Today";if(x.toDateString()===y.toDateString())return "Yesterday";
  return x.toLocaleDateString([],{weekday:"long",month:"long",day:"numeric"})+(x.getFullYear()!==t.getFullYear()?", "+x.getFullYear():"")}
function ago(iso){const x=d(iso);if(!x)return "";const s=(Date.now()-x)/1e3;
  if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" hours ago";
  if(s<172800)return "yesterday";return Math.floor(s/86400)+" days ago"}
async function api(p){const r=await fetch(p);if(!r.ok)throw new Error(r.status);return r.json()}
/* local read overlay (the app doesn't write read state back to PromptQL) */
function seenMap(){try{return JSON.parse(localStorage.getItem("dq_seen")||"{}")}catch(e){return {}}}
function markSeen(tid,ev){const m=seenMap();if((m[tid]||0)<ev){m[tid]=ev;try{localStorage.setItem("dq_seen",JSON.stringify(m))}catch(e){}}}
function isUnread(tid,latest){return (seenMap()[tid]||0)<latest}
function roomUnread(r){return r.unread_threads.filter(t=>isUnread(t.thread_id,t.latest)).length}

/* light markdown */
function md(src){
  let s=esc(src||"");const blocks=[];
  s=s.replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g,(_,c)=>{blocks.push(c);return `\u0000${blocks.length-1}\u0000`});
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,!?]|$)/g,"$1<em>$2</em>");
  s=s.replace(/^#{1,6}\s+(.+)$/gm,'<span class="h">$1</span>');
  s=s.replace(/^(\s*)[-*]\s+/gm,"$1• ");
  s=s.replace(/(^|\s)(@[A-Z][\w.]*(?: [A-Z][\w.()]*){0,3}|@channel|@here)/g,'$1<span class="mn">$2</span>');
  s=s.replace(/\n{3,}/g,"\n\n");
  s=s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<pre>${blocks[i]}</pre>`);
  return s;
}

/* ---------- sidebar ---------- */
function dmLabel(r){const me=S.boot.me.id;const others=r.members.filter(m=>m.id!==me);
  return others.length?others.map(m=>m.name.split(" ")[0]+(others.length===1?" "+(m.name.split(" ")[1]||""):"")).join(", "):(S.boot.me.name+" (you)")}
function renderSide(){
  const b=S.boot;if(!b)return;const q=$("find").value.trim().toLowerCase();
  const match=(r,label)=>!q||r.name.toLowerCase().includes(q)||(label||"").toLowerCase().includes(q);
  const keep=r=>S.filter!=="unread"||roomUnread(r)>0;
  const item=(r,icon,label,sub)=>{const u=roomUnread(r);
    return `<div class="it ${u?"unread":""} ${S.room===r.room_id?"on":""}" data-id="${esc(r.room_id)}" onclick="openRoom(this.dataset.id)" title="${esc(r.description||r.name)}">
      ${icon}<span class="nm">${esc(label)}${sub?`<span class="sub">${esc(sub)}</span>`:""}</span>${u?`<span class="cnt">${u}</span>`:""}</div>`};
  const ch=b.channels.filter(r=>keep(r)&&match(r)).map(r=>item(r,`<span class="ic">${r.visibility==="public"?"#":ic("lock",14)}</span>`,r.name)).join("");
  const dm=b.dms.filter(r=>keep(r)&&match(r,dmLabel(r))).map(r=>{const others=r.members.filter(m=>m.id!==b.me.id);
    const f=others.length>1?face(others.length+"","face","background:#5e5f62"):face((others[0]||{name:b.me.name}).name);
    return item(r,f.replace('class="face"','class="face"'),dmLabel(r),S.filter==="dms"?r.name+" · "+ago(r.latest_at):r.name)}).join("");
  const sec=(id,title,body)=>`<div class="sec" id="${id}"><div class="sec-h" onclick="this.parentNode.classList.toggle('col')"><span class="chev">▼</span>${title}</div><div class="items">${body||`<div class="empty-s">Nothing here</div>`}</div></div>`;
  let html="";
  if(S.filter==="dms")html=sec("s-dm","Direct messages",dm);
  else html=sec("s-dm","Direct messages",dm)+sec("s-ch","Channels",ch);
  $("list").innerHTML=html;DQ.emit("side:render",{list:$("list")});
  const tot=b.channels.concat(b.dms).reduce((a,r)=>a+roomUnread(r),0);
  $("rb-act").style.display=tot?"block":"none";$("rb-act").textContent=tot;
  document.title=(tot?`(${tot}) `:"")+"DreamQL";
}
function setFilter(f){S.filter=f;["home","dms","act"].forEach(k=>$("r-"+k).classList.remove("on"));
  $({all:"r-home",dms:"r-dms",unread:"r-act"}[f]).classList.add("on");renderSide()}
function allRooms(){return S.boot.channels.concat(S.boot.dms)}

/* ---------- artifacts ---------- */
function artUrl(a){return `/api/artifact/${encodeURIComponent(a.thread_id)}/${encodeURIComponent(a.identifier)}`}
function isImg(a){return (a.content_type||"").startsWith("image/")||/\.(png|jpe?g|gif|webp)$/i.test(a.file_name||a.identifier||"")}
function size(n){if(!n)return "";if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(0)+" KB";return (n/1048576).toFixed(1)+" MB"}
function ext(a){const n=a.file_name||a.identifier||"";const m=n.match(/\.([a-z0-9]{1,5})$/i);return m?m[1].toUpperCase():({html:"HTML",app:"APP",table:"TBL",text:"TXT",visualization:"VIZ"}[a.type]||"FILE")}
function cardHtml(a,threadUrl){
  const kind=a.type||"file",u=artUrl(a),meta=[({html:"Page",app:"App",table:"Table",text:"Document",file:"File",visualization:"Chart"}[kind]||"File"),size(a.size)].filter(Boolean).join(" · ");
  const icoBg={html:"#e8912d",app:"#2bac76",table:"#1d9bd1",text:"#d4a017"}[kind]||"#cd2553";
  let btns="",body="";
  if(kind==="app"){btns=`<a href="${esc(threadUrl||"#")}" target="_blank" rel="noopener">Open ↗</a>`}
  else if(kind==="html"){btns=`<button data-u="${esc(u)}" data-t="${esc(a.title)}" onclick="openFrame(this.dataset.u,this.dataset.t)">Open</button><a href="${esc(u)}" download="${esc(a.title)}.html">⤓</a>`}
  else if(kind==="file"&&isImg(a)){body=`<img loading="lazy" src="${esc(u)}" alt="${esc(a.title)}" data-u="${esc(u)}" data-t="${esc(a.title)}" onclick="openImg(this.dataset.u,this.dataset.t)" onerror="this.outerHTML='<div class=prev style=max-height:none>Preview unavailable — open it in PromptQL.</div>'"/>`;btns=`<a href="${esc(u)}" download="${esc(a.file_name||a.title)}">⤓</a>`}
  else if(kind==="file"&&((a.content_type||"").includes("html")||/\.html?$/i.test(a.file_name||""))){btns=`<button data-u="${esc(u)}" data-t="${esc(a.title)}" onclick="openFrame(this.dataset.u,this.dataset.t)">Open</button><a href="${esc(u)}" download="${esc(a.file_name||a.title)}">⤓</a>`}
  else if(kind==="table"||kind==="text"){body=`<div class="prev" data-lazy="${esc(u)}" data-kind="${kind}"><span class="spin"></span></div>`;btns=`<a href="${esc(u)}" target="_blank" rel="noopener">View</a>`}
  else{btns=`<a href="${esc(u)}" download="${esc(a.file_name||a.title)}">⤓ Download</a>`}
  return `<div class="card k-${kind}"><div class="ch"><span class="fi" style="background:${icoBg}">${esc(ext(a))}</span>
    <div style="min-width:0"><div class="ct">${esc(a.title)}</div><div class="cs">${esc(meta)}</div></div><div class="cb">${btns}</div></div>${body}</div>`;
}
function artsHtml(list,url){return list&&list.length?`<div class="arts">${list.map(a=>cardHtml(a,url)).join("")}</div>`:""}
function hydrate(root){
  root.querySelectorAll("[data-lazy]").forEach(async el=>{const u=el.dataset.lazy;el.removeAttribute("data-lazy");
    try{const r=await fetch(u);if(!r.ok)throw 0;
      if(el.dataset.kind==="table"){const rows=await r.json();const data=Array.isArray(rows)?rows:(rows.rows||rows.data||[]);
        if(!data.length){el.textContent="(empty table)";return}const cols=Object.keys(data[0]).slice(0,6);
        el.style.whiteSpace="normal";el.innerHTML=`<table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${data.slice(0,6).map(row=>`<tr>${cols.map(c=>`<td>${esc(typeof row[c]==="object"?JSON.stringify(row[c]):row[c])}</td>`).join("")}</tr>`).join("")}</table><div class="cs" style="margin-top:4px">${data.length} rows</div>`;
      }else{const t=await r.text();el.innerHTML=md(t.slice(0,1200))}
    }catch(e){el.textContent="Preview unavailable — open it in PromptQL."}});
}
function openFrame(u,t){$("mbox").innerHTML=`<div class="bh">${esc(t)}<button onclick="closeModal()">×</button></div><iframe sandbox="allow-scripts allow-popups" src="${esc(u)}"></iframe>`;$("modal").classList.add("open")}
function openImg(u,t){$("mbox").innerHTML=`<div class="bh">${esc(t)}<button onclick="closeModal()">×</button></div><div class="imgbox"><img src="${esc(u)}"/></div>`;$("modal").classList.add("open")}
function closeModal(){$("modal").classList.remove("open");$("mbox").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();if($("tp").classList.contains("open"))closeThread()}});

/* ---------- channel / DM view ---------- */
async function openRoom(id,keepScroll){
  if(S.room!==id){S.tab="messages";closeThread()}
  S.room=id;renderSide();DQ.emit("nav:open",{type:"room",id,refresh:!!keepScroll});
  const r=allRooms().find(x=>x.room_id===id);
  if(!keepScroll)$("pane").innerHTML=headerHtml(r)+`<div class="feed"><div class="blank"><span class="spin"></span></div></div>`;
  let data;try{data=await api("/api/room/"+id)}catch(e){$("pane").innerHTML=headerHtml(r)+`<div class="blank">Couldn't load this conversation (${e.message}).</div>`;return}
  if(S.room!==id)return;
  const firstNew=data.threads.find(t=>t.unread&&isUnread(t.thread_id,t.latest_event_id));
  if(!keepScroll)S.newFrom=firstNew?firstNew.thread_id:null;
  S.roomData=data;renderPane(keepScroll);
  data.threads.forEach(t=>markSeen(t.thread_id,t.latest_event_id)); // viewing a channel marks it read, like Slack
  {const items=data.threads.filter(t=>t.unread).map(t=>({thread_id:t.thread_id,event_id:t.latest_event_id}));if(items.length)syncSeen(items)}
  renderSide();
}
function headerHtml(r){
  const isDm=r.kind==="dm";const title=isDm?dmLabel(r):r.name;
  const icon=isDm?"":(r.visibility==="public"?"#":ic("lock",14));
  const mem=r.members.slice(0,3).map(m=>face(m.name)).join("");
  const nFiles=S.roomData&&S.room===r.room_id?S.roomData.files.length:"";
  return `<div class="chead"><div class="row"><div class="t">${icon?`<span style="opacity:.8">${icon}</span>`:""}<span>${esc(title)}</span>${isDm?`<span style="font-size:13px;font-weight:400;color:var(--muted)">· ${esc(r.name)}</span>`:""}</div>
    <div class="right"><span class="stack">${mem}</span><span>${r.members.length||""}</span></div></div>
    ${r.description?`<div class="desc">${esc(r.description)}</div>`:""}
    <div class="tabs"><button class="tab ${S.tab==="messages"?"on":""}" onclick="showTab('messages')">${ic("dms",14)} Messages</button>
    <button class="tab ${S.tab==="files"?"on":""}" onclick="showTab('files')">${ic("files",14)} Files${nFiles!==""?` <span style="opacity:.7">${nFiles}</span>`:""}</button>
    <button class="tab ${S.tab==="pins"?"on":""}" onclick="showTab('pins')">${ic("pin",14)} Pins</button></div></div>`;
}
function showTab(t){if(!S.room)return;S.tab=t;renderPane()}
function renderPane(keepScroll){
  const r=allRooms().find(x=>x.room_id===S.room),data=S.roomData;
  const label=r.kind==="dm"?dmLabel(r):(r.visibility==="public"?"#":"")+r.name;
  const draft=$("cin")?$("cin").value:"",hadFocus=document.activeElement&&document.activeElement.id==="cin";const prevFeed=document.querySelector("#pane .feed");const prevTop=prevFeed?prevFeed.scrollTop:0;const atBottom=prevFeed?prevFeed.scrollHeight-prevFeed.scrollTop-prevFeed.clientHeight<40:true;
  let body="";
  if(S.tab==="files"){body=data.files.length?`<div class="fgrid">${data.files.map(f=>`<div>${cardHtml(f,"")}<div class="from" data-id="${esc(f.thread_id)}" onclick="openThread(this.dataset.id)">in “${esc(f.thread_title)}” · ${esc(ago(f.created_at))}</div></div>`).join("")}</div>`:`<div class="blank">No files shared here yet.</div>`}
  else if(S.tab==="pins"){body=`<div class="blank">Nothing pinned in this conversation yet.</div>`}
  else if(!data.threads.length){body=`<div class="blank">This is the very beginning of <b>${esc(label)}</b>.</div>`}
  else{let last=null;body=data.threads.map(t=>{let h="";const k=dayKey(t.ts);
      if(k!==last){h+=`<div class="day"><span>${esc(dayLabel(t.ts))}</span></div>`;last=k}
      if(S.newFrom===t.thread_id)h+=`<div class="newline"><span>New</span></div>`;
      const ur=t.unread&&isUnread(t.thread_id,t.latest_event_id);
      const ps=[...new Set(t.participants)].slice(0,4).map(n=>face(n)).join("");
      return h+`<div class="msg ${ur?"unread-msg":""}" data-text="${esc((t.text+" "+t.title).toLowerCase())}">${face(t.author)}
        <div class="mc"><div class="mh"><span class="au">${esc(t.author)}</span><span class="tm">${esc(tm(t.ts))}</span></div>
        <div class="tx">${md(t.text)}</div>${artsHtml(t.artifacts,t.url)}
        <div class="reply ${ur?"ur":""}" data-id="${esc(t.thread_id)}" onclick="openThread(this.dataset.id)"><span class="stack" style="margin-left:6px">${ps}</span>
          <span class="rc">${t.reply_count?t.reply_count+" "+(t.reply_count===1?"reply":"replies"):"View thread"}</span>
          <span class="lr">Last reply ${esc(ago(t.last_reply_at))}</span><span class="vt">View thread ›</span></div></div></div>`}).join("")}
  $("pane").innerHTML=headerHtml(r)+`<div class="feed" id="feed">${body}</div>`+
    (S.tab==="messages"?`<div class="composer"><textarea class="in" id="cin" rows="1" placeholder="Message ${esc(label)}" onkeydown="ckey(event,'room')" oninput="grow(this)"></textarea><div class="tb">${toolbarHtml()}<button class="snd" id="csnd" onclick="send('room')" title="Send">${ic("send")}</button></div></div><div class="ro">Enter to send · Shift+Enter for a new line · posting here starts a new thread · tag @DreamBot to bring the bot in</div>`:"");
  const feed=$("feed");hydrate(feed);if($("cin"))DQ.emit("composer:mount",{kind:"room",input:$("cin"),composer:$("cin").closest(".composer")});if($("cin")&&draft){$("cin").value=draft;grow($("cin"))}if(hadFocus&&$("cin"))$("cin").focus();
  if(keepScroll&&!atBottom){feed.scrollTop=prevTop}
  else{const nl=feed.querySelector(".newline");if(nl&&!keepScroll)nl.scrollIntoView({block:"center"});else feed.scrollTop=feed.scrollHeight}
  searchFeed($("search").value);
}
function searchFeed(q){q=(q||"").trim().toLowerCase();document.querySelectorAll("#feed .msg").forEach(m=>{
  const hit=q&&m.dataset.text.includes(q);m.classList.toggle("hit",!!hit);m.style.display=q&&!hit?"none":""})}

/* ---------- thread panel ---------- */
async function openThread(tid){
  S.thread=tid;const tp=$("tp");tp.classList.add("open");
  const t=(S.roomData&&S.roomData.threads.find(x=>x.thread_id===tid))||{title:""};
  const r=S.room?allRooms().find(x=>x.room_id===S.room):null;
  const where=r?(r.kind==="dm"?esc(dmLabel(r)):(r.visibility==="public"?"# ":ic("lock",13)+" ")+esc(r.name)):"";
  tp.innerHTML=`<div class="tph"><span class="t">Thread</span><span class="s">${where}</span><a href="${esc(t.url||"#")}" target="_blank" rel="noopener">Open in PromptQL ↗</a><button class="x" onclick="closeThread()">×</button></div><div class="feed" id="tfeed"><div class="blank"><span class="spin"></span></div></div><div class="composer"><textarea class="in" id="tin" rows="1" placeholder="Reply…" onkeydown="ckey(event,'thread')" oninput="grow(this)"></textarea><div class="tb">${toolbarHtml()}<button class="snd" onclick="send('thread')" title="Send">${ic("send")}</button></div></div><div class="ro">Enter to send · tag @DreamBot to get the bot to respond</div>`;
  DQ.emit("composer:mount",{kind:"thread",input:$("tin"),composer:$("tin").closest(".composer")});DQ.emit("nav:open",{type:"thread",id:tid,room:S.room});
  await loadThread(tid);setTimeout(()=>$("tin")&&$("tin").focus(),50)}
async function loadThread(tid,keep){
  const tf0=$("tfeed");const tTop=tf0?tf0.scrollTop:0,tBottom=tf0?tf0.scrollHeight-tf0.scrollTop-tf0.clientHeight<40:true;
  let d;try{d=await api("/api/thread/"+tid)}catch(e){$("tfeed").innerHTML=`<div class="blank">Couldn't load this thread (${e.message}).</div>`;return}
  if(S.thread!==tid)return;
  const seenBefore=seenMap()[tid]||d.last_seen_event_id;
  const ms=d.messages;
  if(!ms.length){$("tfeed").innerHTML=`<div class="blank">This conversation lives in the newer PromptQL format.<br/><a href="${esc(d.url)}" target="_blank">Open it in PromptQL ↗</a></div>`;return}
  const row=(m,isNew)=>`<div class="msg ${isNew?"unread-msg":""}">${face(m.author)}<div class="mc"><div class="mh"><span class="au">${esc(m.author)}</span><span class="tm">${esc(tm(m.ts))}</span></div><div class="tx">${md(m.text)}</div>${artsHtml(m.artifacts,d.url)}</div></div>`;
  let html=row(ms[0],false);
  if(ms.length>1)html+=`<div class="rdiv">${ms.length-1} ${ms.length===2?"reply":"replies"}</div>`;
  let newShown=false,last=dayKey(ms[0].ts);
  ms.slice(1).forEach(m=>{const k=dayKey(m.ts);if(k!==last){html+=`<div class="day"><span>${esc(dayLabel(m.ts))}</span></div>`;last=k}
    const isNew=m.id>seenBefore&&seenBefore>0;if(isNew&&!newShown){html+=`<div class="newline"><span>New</span></div>`;newShown=true}
    html+=row(m,isNew)});
  $("tfeed").innerHTML=html;hydrate($("tfeed"));
  if(S.thread===tid&&Date.now()<(S.botUntil||0)&&ms.length&&ms[ms.length-1].author!==BOT){$("tfeed").insertAdjacentHTML("beforeend",`<div class="working">${face(BOT)} DreamBot is working on it…</div>`)}
  const nl=$("tfeed").querySelector(".newline");if(keep&&!tBottom)$("tfeed").scrollTop=tTop;else if(nl&&!keep)nl.scrollIntoView({block:"center"});else $("tfeed").scrollTop=$("tfeed").scrollHeight;
  if(d.latest_event_id>d.last_seen_event_id)syncSeen([{thread_id:tid,event_id:d.latest_event_id}]);
  markSeen(tid,Math.max(d.latest_event_id,ms[ms.length-1].id));renderSide();
  if(S.tab==="messages"&&S.roomData)renderPane(true);
}
function closeThread(){S.thread=null;$("tp").classList.remove("open");$("tp").innerHTML=""}


function toast(m,ok){const t=$("toast");t.textContent=m;t.className="toast"+(ok?" ok":"");t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",ok?2500:6000)}
function grow(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,200)+"px";const b=el.closest(".composer").querySelector(".snd");if(b)b.classList.toggle("go",!!el.value.trim())}
function ckey(e,k){for(const f of (DQ.hooks["composer:key"]||[])){try{if(f(e,k)===true)return}catch(x){console.warn("DQ key",x)}}if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(k)}}
async function postJSON(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("HTTP "+r.status));return j}
async function syncSeen(items){try{await postJSON("/api/seen",{items})}catch(e){console.warn("read sync",e)}}
async function send(kind){
  const el=$(kind==="room"?"cin":"tin");if(!el)return;const text=el.value.trim();if((!text&&!el.dataset.attach)||el.disabled)return;
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;el.disabled=true;
  try{
    const p=await DQ.pipe("send:before",{kind,text,uploads:[],room:S.room,thread:kind==="thread"?S.thread:null,thread_id:null,timezone:tz,input:el});
    const body={text:p.text||"",timezone:tz};if(p.uploads&&p.uploads.length)body.uploads=p.uploads;
    if(kind==="room"&&!p.thread_id){const room=S.room;const j=await postJSON(`/api/room/${room}/post`,body);el.value="";delete el.dataset.attach;
      if(j.bot_triggered)S.botUntil=Date.now()+180000;DQ.emit("send:after",{kind,result:j});await openRoom(room,false);if(j.thread_id)openThread(j.thread_id)}
    else{const tid=p.thread_id||S.thread;const j=await postJSON(`/api/thread/${tid}/reply`,body);el.value="";delete el.dataset.attach;grow(el);
      if(j.bot_triggered)S.botUntil=Date.now()+180000;DQ.emit("send:after",{kind,result:j});
      if(kind==="room"){await openRoom(S.room,false);openThread(tid)}else await loadThread(S.thread,false)}
  }catch(e){toast("Couldn't send: "+e.message)}
  finally{const e2=$(kind==="room"?"cin":"tin");if(e2){e2.disabled=false;e2.focus()}}
}
// while DreamBot is working, poll the open thread faster
setInterval(()=>{if(!document.hidden&&S.thread&&Date.now()<(S.botUntil||0))loadThread(S.thread,true)},5000);

typeof S!=="undefined"&&(DQ.S=S);typeof esc!=="undefined"&&(DQ.esc=esc);typeof api!=="undefined"&&(DQ.api=api);typeof postJSON!=="undefined"&&(DQ.postJSON=postJSON);typeof toast!=="undefined"&&(DQ.toast=toast);typeof grow!=="undefined"&&(DQ.grow=grow);typeof ic!=="undefined"&&(DQ.ic=ic);typeof face!=="undefined"&&(DQ.face=face);typeof md!=="undefined"&&(DQ.md=md);typeof hydrate!=="undefined"&&(DQ.hydrate=hydrate);typeof allRooms!=="undefined"&&(DQ.allRooms=allRooms);typeof dmLabel!=="undefined"&&(DQ.dmLabel=dmLabel);typeof openRoom!=="undefined"&&(DQ.openRoom=openRoom);typeof openThread!=="undefined"&&(DQ.openThread=openThread);typeof loadThread!=="undefined"&&(DQ.loadThread=loadThread);typeof closeThread!=="undefined"&&(DQ.closeThread=closeThread);typeof renderSide!=="undefined"&&(DQ.renderSide=renderSide);typeof renderPane!=="undefined"&&(DQ.renderPane=renderPane);typeof syncSeen!=="undefined"&&(DQ.syncSeen=syncSeen);typeof markSeen!=="undefined"&&(DQ.markSeen=markSeen);typeof seenMap!=="undefined"&&(DQ.seenMap=seenMap);typeof isUnread!=="undefined"&&(DQ.isUnread=isUnread);typeof send!=="undefined"&&(DQ.send=send);typeof showTab!=="undefined"&&(DQ.showTab=showTab);typeof setFilter!=="undefined"&&(DQ.setFilter=setFilter);typeof refreshAll!=="undefined"&&(DQ.refreshAll=refreshAll);typeof loadBoot!=="undefined"&&(DQ.loadBoot=loadBoot);typeof ago!=="undefined"&&(DQ.ago=ago);typeof tm!=="undefined"&&(DQ.tm=tm);
window.addEventListener("DOMContentLoaded",async()=>{paintIcons();try{if(await loadBoot()){const first=S.boot.dms[0]||S.boot.channels[0];if(first)openRoom(first.room_id)}}catch(e){$("list").innerHTML=`<div class="empty-s" style="padding:16px">Couldn't load (${esc(e.message)}). If prompted, approve the app's access and reload.</div>`}
